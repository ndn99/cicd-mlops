name: CI
run-name: ${{ github.actor }} is learning GitHub Actions ML

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
env:
  DB_FLAG: CI

jobs:
  Build:
    runs-on: ubuntu-latest
    environment: coder

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Echo Docker credentials
        run: |
          echo "DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}"
          echo "DOCKER_PASSWORD: ******"  # Ẩn không in ra mật khẩu thật

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Copy files to Docker container
        run: |
          docker build -t bim81929/demo-app -f Dockerfile .
      - name: Push modified Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo-app

  DeployDev:
    name: Deploy to Dev 
    needs: [Build]
    runs-on: ubuntu-latest
    environment: coder
    steps:
      - uses: actions/checkout@v3
      
      # Cài đặt CLI của Coder
      - name: Install Coder CLI
        run: |
          curl -L https://2dde7e7hj6fem.pit-1.try.coder.app/install.sh | sh
          coder --version
      - name: Authenticate with Coder
        run: |
          echo "Coder URL: ${{ vars.CODER_URL }}"
          echo "Coder Token: ${{ secrets.CODER_SESSION_TOKEN }}"
          coder login ${{ vars.CODER_URL }} --token "${{ secrets.CODER_SESSION_TOKEN }}"
          echo "Login OK!"

      - name: Set workspace variables
        run: |
          echo "WORKSPACE_NAME=mlflow-dev-workspace" >> $GITHUB_ENV
          echo "DOCKER_IMAGE=bim81929/demo-app" >> $GITHUB_ENV
      - name: Check if workspace exists
        id: check-workspace
        run: |
          if coder list | grep -q "${{ env.WORKSPACE_NAME }}"; then
            coder delete --yes "${{ env.WORKSPACE_NAME }}"
            echo "workspace_exists=true" >> $GITHUB_OUTPUT
            while coder list | grep -q "${{ env.WORKSPACE_NAME }}"; do
              echo "Waiting for workspace to be deleted..."
              sleep 10
            done
          fi
          echo "workspace_exists=false" >> $GITHUB_OUTPUT
      - name: Create new workspace
        if: steps.check-workspace.outputs.workspace_exists == 'false'
        run: |
          # Tạo workspace mới với docker image chỉ định
          coder create  -v --yes mlflow-dev-workspace --template kubernetes --parameter cpu=4 --parameter memory=8GB --parameter home_disk_size=50GB